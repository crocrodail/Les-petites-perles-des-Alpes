steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  # delete .env file and rename .env.prod to .env
  - name: 'ubuntu'
    entrypoint: 'bash'
    args: ['-c', 'rm -f .env && cp .env.prod .env']
    
  # Build the React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']

  # Clean up old images from Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # First create the repository if it doesn't exist
        gcloud artifacts repositories describe docker-repo --location=us --project=$PROJECT_ID || gcloud artifacts repositories create docker-repo --repository-format=docker --location=us --project=$PROJECT_ID
        # Keep only the 3 most recent images and delete the rest
        gcloud artifacts docker images list us-docker.pkg.dev/$PROJECT_ID/docker-repo/frontend-venato --format="value(version)" | sort -r | tail -n +4 | xargs -r -I {} gcloud artifacts docker images delete us-docker.pkg.dev/$PROJECT_ID/docker-repo/frontend-venato@{} --quiet
    

  # Build the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-docker.pkg.dev/$PROJECT_ID/docker-repo/site-lespetitesperlesdesalpes', '.']
    
  # Push the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-docker.pkg.dev/$PROJECT_ID/docker-repo/site-lespetitesperlesdesalpes']
    
  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'site-lespetitesperlesdesalpes'
      - '--image=us-docker.pkg.dev/$PROJECT_ID/docker-repo/site-lespetitesperlesdesalpes'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'

# Optionally specify a timeout
timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY

# Images to be stored in Artifact Registry
images:
  - 'us-docker.pkg.dev/$PROJECT_ID/docker-repo/site-lespetitesperlesdesalpes'